name: Check Upstream Updates

on:
  schedule:
    # Every Wednesday 11:30 UTC = 19:30 China Standard Time.
    # Runs before the usual Thursday Epic weekly-free refresh/claim window.
    - cron: "30 11 * * 3"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send Telegram even when upstream has no updates"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-upstream-updates
  cancel-in-progress: true

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Ronchy2000/epic-freebies-helper.git
          git fetch --no-tags upstream master

      - name: Compare fork with upstream
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          BEHIND="$(git rev-list --count HEAD..upstream/master)"
          AHEAD="$(git rev-list --count upstream/master..HEAD)"
          UPSTREAM_SHA="$(git rev-parse --short=12 upstream/master)"
          UPSTREAM_SUBJECT="$(git log -1 --format=%s upstream/master)"

          {
            echo "behind=${BEHIND}"
            echo "ahead=${AHEAD}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "upstream_subject<<EOF"
            echo "${UPSTREAM_SUBJECT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Fork is ${BEHIND} commit(s) behind upstream and ${AHEAD} commit(s) ahead."

      - name: Notify Telegram when upstream has updates
        if: steps.compare.outputs.behind != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          AHEAD: ${{ steps.compare.outputs.ahead }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          UPSTREAM_SUBJECT: ${{ steps.compare.outputs.upstream_subject }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::warning::Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          TEXT="$(cat <<EOF
          📦 epic-freebies-helper 上游有更新

          当前 Fork：${REPOSITORY}
          落后上游：${BEHIND} 个 commit
          Fork 独有：${AHEAD} 个 commit
          上游最新：${UPSTREAM_SHA}
          ${UPSTREAM_SUBJECT}

          请先检查改动，再到仓库首页：
          Sync fork → Update branch

          https://github.com/${REPOSITORY}
          EOF
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            >/dev/null

          echo "Telegram update notification sent."

      - name: Send manual test notification
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.test_notification == true &&
          steps.compare.outputs.behind == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AHEAD: ${{ steps.compare.outputs.ahead }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 1
          fi

          TEXT="$(cat <<EOF
          ✅ 上游检查通知测试成功

          ${REPOSITORY} 当前没有落后上游。
          Fork 独有：${AHEAD} 个 commit
          上游版本：${UPSTREAM_SHA}

          以后发现上游更新时，我会通过这里提醒你。
          EOF
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            >/dev/null

          echo "Telegram test notification sent."
